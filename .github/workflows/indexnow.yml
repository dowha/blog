name: 'IndexNow URL Submission'

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  submit-urls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests

      - name: Submit URLs to IndexNow (Naver & Bing)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python3 <<EOF
          import requests
          import xml.etree.ElementTree as ET
          import os

          indexnow_key = os.environ.get('INDEXNOW_KEY')
          if not indexnow_key:
              raise ValueError('❌ ERROR: INDEXNOW_KEY is not set!')

          # 1. 파일 경로 설정 (블로그 소스 내 sitemap.xml 위치 확인 필요)
          # 보통 루트에 있다면 'sitemap.xml', 특정 폴더에 있다면 'public/sitemap.xml' 등
          sitemap_path = 'sitemap.xml' 

          try:
              # 2. 인터넷 요청 대신 로컬 파일 읽기
              if not os.path.exists(sitemap_path):
                  # 만약 루트에 없다면 다른 흔한 경로(public/ 등)도 확인 시도
                  possible_paths = ['public/sitemap.xml', '_site/sitemap.xml']
                  for p in possible_paths:
                      if os.path.exists(p):
                          sitemap_path = p
                          break
              
              print(f'🔍 Reading sitemap from: {sitemap_path}')
              with open(sitemap_path, 'r', encoding='utf-8') as f:
                  sitemap_content = f.read()

              # XML 파싱
              root = ET.fromstring(sitemap_content)
              namespace = {'ns': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
              urls = [url.text for url in root.findall('ns:url/ns:loc', namespaces=namespace)]

              if not urls:
                  print("⚠️ No URLs found in sitemap.")
                  exit(0)

              # 최신 URL 5개 선택
              latest_urls = urls[-5:]

              # IndexNow 전송 로직 (이 부분은 외부 API 호출이므로 requests 유지)
              endpoints = {
                  "IndexNow": "https://api.indexnow.org/indexnow?url={url}&key=" + indexnow_key,
                  "Bing": "https://www.bing.com/indexnow?url={url}&key=" + indexnow_key,
                  "Naver": "https://searchadvisor.naver.com/indexnow?url={url}&key=" + indexnow_key
              }

              for url in latest_urls:
                  for name, endpoint in endpoints.items():
                      full_url = endpoint.format(url=url)
                      res = requests.get(full_url)
                      if res.status_code == 200:
                          print(f'✅ {name} 성공: {url}')
                      else:
                          print(f'❌ {name} 실패: {url}, 상태 코드: {res.status_code}')

          except Exception as e:
              print(f'❌ Exception occurred: {e}')
              exit(1)
          EOF
